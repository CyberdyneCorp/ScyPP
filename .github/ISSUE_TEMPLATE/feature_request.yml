name: Feature request
description: Propose a new capability (SciPy surface, backend, tooling)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or limitation motivating the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What you'd like SciPP to do. Larger features are developed spec-first with OpenSpec — see CONTRIBUTING.md. If it ports a SciPy routine, link the SciPy reference.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - special / constants
        - linalg / sparse
        - fft
        - optimize / integrate / interpolate
        - stats / cluster / odr
        - signal / ndimage
        - spatial / io
        - Backend (CPU / BLAS / LAPACK / CUDA / OpenCL / Metal)
        - Build / packaging / tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds, if any.
